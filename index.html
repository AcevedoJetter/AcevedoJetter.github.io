    <script>
      // Decode the path encoded by 404.html and restore it via history.replaceState
      // so the React router sees the correct URL without a page reload.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            });
          window.history.replaceState(
            null,
            null,
            decoded.shift() +
              (decoded.length ? "?" + decoded.join("&") : "") +
              l.hash,
          );
        }
      })(window.location);
    </script>
